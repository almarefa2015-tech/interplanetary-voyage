<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Interplanetary Voyage</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;color:#e8fbff}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;pointer-events:none;z-index:5}
.pill{background:rgba(6,20,30,.72);border:1px solid rgba(80,230,255,.35);border-radius:14px;padding:6px 12px;font-weight:700;font-size:15px;box-shadow:0 0 12px rgba(0,200,255,.15)}
#res{top:max(8px,env(safe-area-inset-top));inset-inline-start:10px;display:flex;gap:8px}
#clock{top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%)}
#topR{top:max(8px,env(safe-area-inset-top));inset-inline-end:10px;display:flex;gap:8px}
.btn{pointer-events:auto;background:rgba(6,24,36,.82);border:1px solid rgba(80,230,255,.5);color:#dff9ff;border-radius:14px;min-width:46px;height:46px;padding:0 12px;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 0 14px rgba(0,210,255,.18)}
.btn:active{transform:scale(.95);background:rgba(20,70,90,.9)}
.btn small{font-size:13px}
.btn.on{background:rgba(0,150,190,.85)}
#acts{bottom:max(10px,env(safe-area-inset-bottom));inset-inline-end:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#mini{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));inset-inline-start:10px;width:130px;height:130px;border:1px solid rgba(80,230,255,.5);border-radius:10px;z-index:5;background:#000;touch-action:none}
#hint{bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:min(560px,62vw);text-align:center;font-size:15px;line-height:1.45;display:none}
#hint.show{display:block;animation:pop .35s}
@keyframes pop{from{transform:translateX(-50%) scale(.9);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#toast{top:64px;left:50%;transform:translateX(-50%);font-size:15px;display:none}
.panel{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,6,12,.6)}
.panel.show{display:flex}
.card{background:linear-gradient(160deg,rgba(8,30,44,.97),rgba(4,14,22,.97));border:1px solid rgba(80,230,255,.5);border-radius:18px;padding:18px 20px;max-width:min(92vw,620px);text-align:center;box-shadow:0 0 30px rgba(0,200,255,.25)}
.card h2{margin:4px 0 10px;font-size:22px;color:#7ff0ff}
.card p{margin:6px 0 12px;font-size:15px;line-height:1.5;color:#cdeef5}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.item{pointer-events:auto;width:150px;background:rgba(10,40,56,.9);border:1px solid rgba(80,230,255,.4);border-radius:14px;padding:8px;cursor:pointer}
.item img{width:100%;height:92px;object-fit:contain}
.item b{display:block;font-size:15px;margin:4px 0 2px}
.item span{font-size:14px;color:#8ff}
.item.dis{opacity:.45}
.big{pointer-events:auto;background:linear-gradient(180deg,#19c3e6,#0a7fa3);border:0;color:#fff;font-size:18px;font-weight:800;border-radius:14px;padding:12px 22px;margin:6px;cursor:pointer}
.big.alt{background:rgba(20,60,80,.95);border:1px solid rgba(80,230,255,.5)}
#introBox{position:fixed;inset:0;z-index:40;background:#000;display:none;align-items:center;justify-content:center}
#introBox.show{display:flex}
#introVid{width:100%;height:100%;object-fit:contain;background:#000}
#skip{position:absolute;top:max(14px,env(safe-area-inset-top));inset-inline-end:16px}
#sub{position:absolute;bottom:8%;left:0;right:0;text-align:center;font-size:clamp(16px,3vw,28px);font-weight:700;text-shadow:0 2px 6px #000;padding:0 10%}
#place{position:fixed;z-index:6;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:none;gap:12px}
#place.show{display:flex}
#loading{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;font-size:18px;color:#7ff0ff}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="mini" width="130" height="130"></canvas>

<div id="res" class="hud"><div class="pill" id="crys">💎 0</div><div class="pill" id="crew">👨‍🚀 0</div></div>
<div id="clock" class="hud pill">☀️</div>
<div id="topR" class="hud"><div class="btn" id="bHelp">💡</div><div class="btn" id="bMenu">⚙️</div></div>
<div id="acts" class="hud">
  <div class="btn" id="bBuild">🏗️ <small data-t="build"></small></div>
  <div class="btn" id="bAll">👥 <small data-t="all"></small></div>

</div>
<div id="hint" class="hud pill"></div>
<div id="toast" class="hud pill"></div>
<div id="place"><div class="big" id="pOk">✔</div><div class="big alt" id="pNo">✖</div></div>

<div class="panel" id="buildP"><div class="card">
  <h2 data-t="build"></h2>
  <div class="row">
    <div class="item" id="itTower"><img src="assets/b_tower.png"><b data-t="tower"></b><span>💎 100</span></div>
    <div class="item" id="itAstro"><img id="astroIcon" alt=""><b data-t="astro"></b><span>💎 80</span></div>
  </div>
  <div class="big alt" id="buildClose" data-t="close"></div>
</div></div>

<div class="panel" id="menuP"><div class="card">
  <h2>Interplanetary Voyage</h2>
  <div class="big" id="mResume" data-t="resume"></div>
  <div class="big alt" id="mIntro" data-t="intro"></div>
  <div class="big alt" id="mNew" data-t="newgame"></div>
</div></div>

<div class="panel" id="endP"><div class="card">
  <h2 id="endT"></h2><p id="endM"></p>
  <div class="row" id="endBtns"></div>
</div></div>

<div id="introBox"><video id="introVid" playsinline preload="auto"></video><div id="sub"></div><div class="btn" id="skip" data-t="skip"></div></div>
<div id="loading">…</div>

<script>
"use strict";
// ============================================================ language

         "Select astronauts and tap crystals to mine. Build laser towers before night. Train more astronauts from the Build menu. Water and mountains block movement."],

  nightC: ["🌙 حلّ الليل... استعدوا!", "🌙 Night has fallen... get ready!"], dawn: ["☀️ طلع النهار. تم حفظ اللعبة", "☀️ Dawn. Game saved"],
  down: ["رائد فضاء أصيب وسيعود للقاعدة", "An astronaut was hurt and will return to base"],
  lostT: ["سقطت القاعدة", "The base has fallen"], lostM: ["الكائنات دمرت مركز القيادة. يمكنك المحاولة من آخر حفظ.", "The creatures destroyed the command center. Try again from your last save."],
  retry: ["المحاولة من آخر حفظ", "Retry from last save"],
  winT: ["تم تأمين القاعدة! 🚀", "Base secured! 🚀"],
  winM: ["صمدت 5 ليالٍ على كوكب غريب. إذا أعجبتك اللعبة، قيّمها على جوجل بلاي، فهذا يساعدنا كثيراً ⭐", "You survived 5 nights on an alien world. If you enjoy the game, please rate it on Google Play, it really helps us ⭐"],
  rate: ["⭐ قيّم اللعبة", "⭐ Rate the game"], cont: ["متابعة اللعب", "Keep playing"],
  sure: ["بدء لعبة جديدة؟ سيضيع التقدم الحالي.", "Start a new game? Current progress will be lost."], yes: ["نعم", "Yes"], no: ["لا", "No"],
  subs: [["الأرض تختنق... والموارد تنفد", "حتى اخترع العلماء محرك الالتواء", "ولأول مرة، أصبح السفر إلى النجوم ممكنًا", "الوجهة: كوكب بعيد... قد يكون موطننا الجديد", "لكن الرحلة لم تنتهِ كما خُطط لها..."],
         ["Earth is suffocating... and its resources are running out", "Until scientists invented the warp drive", "For the first time, travel to the stars became possible", "The destination: a distant planet... perhaps our new home", "But the journey did not end as planned..."]]
};
const T = k => TX[k][AR ? 0 : 1];
document.querySelectorAll("[data-t]").forEach(e => e.textContent = T(e.dataset.t));
const PLAY_URL = "https://play.google.com/store/apps/details?id=com.interplanetary.voyage";

// ============================================================ assets
const A = {};
const IMG = ["tex_ground", "tex_sand", "tex_grass", "tex_cliff", "tex_water", "b_command", "b_tower", "p_tree", "p_crystal", "p_rock",
  "s_astro_front", "s_astro_back", "s_astro_side", "s_beast_front", "s_beast_side"];
function loadAll() {
  return Promise.all(IMG.map(n => new Promise(res => {
    const i = new Image();
    i.onload = () => { A[n] = i; res(); };
    i.onerror = () => { console.warn("missing", n); res(); };
    i.src = "assets/" + n + (n.startsWith("tex_") ? ".jpg" : ".png");
  })));
}
const SHEET = { s_astro_front: 12, s_astro_back: 12, s_astro_side: 12, s_beast_front: 12, s_beast_side: 12 };

// ============================================================ helpers
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const mini = document.getElementById("mini"), mctx = mini.getContext("2d");
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let toastT = 0;
function toast(m) { const e = $("toast"); e.textContent = m; e.style.display = "block"; toastT = 2.6; }

// ============================================================ audio (code-made effects)
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } return AC; }
function zap() {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(1400, a.currentTime); o.frequency.exponentialRampToValueAtTime(220, a.currentTime + .18);
  g.gain.setValueAtTime(.06, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .2);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .22);
}
function chime(f) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = "sine"; o.frequency.value = f || 660;
  g.gain.setValueAtTime(.08, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .35);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .4);
}

// ============================================================ world generation
const CELL = 32, N = 160, WORLD = CELL * N;
let H, TH, walk, occ, reach, seed;
function genWorld(sd) {
  seed = sd;
  const r = rng(sd);
  // value-noise lattices
  const lat = [];
  const oct = [[20, 1], [10, .5], [5, .25], [2.5, .12]];
  for (const [s] of oct) { const n = Math.ceil(N / s) + 2, g = new Float32Array(n * n); for (let i = 0; i < g.length; i++) g[i] = r(); lat.push([s, n, g]); }
  function vn(x, y) {
    let v = 0, w = 0;
    oct.forEach(([s, amp], k) => {
      const [, n, g] = lat[k];
      const fx = x / s, fy = y / s, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
      const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
      const a = g[iy * n + ix], b = g[iy * n + ix + 1], c = g[(iy + 1) * n + ix], d = g[(iy + 1) * n + ix + 1];
      v += amp * lerp(lerp(a, b, sx), lerp(c, d, sx), sy); w += amp;
    });
    return v / w;
  }
  H = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) H[y * N + x] = vn(x, y);
  // thresholds from percentiles
  const s = Array.from(H).sort((a, b) => a - b), P = p => s[Math.floor(p * (s.length - 1))];
  TH = { water: P(.17), sand: P(.23), grass: P(.52), cliff: P(.86) };
  // flatten the landing zone in the middle
  const mid = (TH.sand + TH.grass) / 2 + (TH.grass - TH.sand) * .25, c = N / 2;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const d = Math.hypot(x - c, y - c), k = 1 - smooth(9, 17, d);
    H[y * N + x] = lerp(H[y * N + x], mid, k);
  }
  // map edge becomes sea
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const e = Math.min(x, y, N - 1 - x, N - 1 - y), k = 1 - smooth(0, 7, e);
    H[y * N + x] = lerp(H[y * N + x], TH.water - .08, k);
  }
  walk = new Uint8Array(N * N); occ = new Uint8Array(N * N);
  for (let i = 0; i < N * N; i++) walk[i] = H[i] > TH.water + .006 && H[i] < TH.cliff - .004 ? 1 : 0;
  // reachable area from the landing zone
  reach = new Uint8Array(N * N);
  const q = [c * N + c]; reach[q[0]] = 1;
  while (q.length) { const i = q.pop(), x = i % N, y = (i / N) | 0; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue; const j = ny * N + nx; if (!reach[j] && walk[j]) { reach[j] = 1; q.push(j); } } }
  chunks.clear(); buildMinimapBase();
}
function hAt(wx, wy) { // bilinear height at world px
  const fx = clamp(wx / CELL - .5, 0, N - 1.001), fy = clamp(wy / CELL - .5, 0, N - 1.001), ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy;
  const a = H[iy * N + ix], b = H[iy * N + ix + 1], c = H[(iy + 1) * N + ix], d = H[(iy + 1) * N + ix + 1];
  return lerp(lerp(a, b, tx), lerp(c, d, tx), ty);
}
const cellOf = (x, y) => [clamp(Math.floor(x / CELL), 0, N - 1), clamp(Math.floor(y / CELL), 0, N - 1)];
const free = (cx, cy) => cx >= 0 && cy >= 0 && cx < N && cy < N && walk[cy * N + cx] && !occ[cy * N + cx];
function markOcc(x, y, r, v) { const [a, b] = cellOf(x - r, y - r), [c, d] = cellOf(x + r, y + r); for (let j = b; j <= d; j++) for (let i = a; i <= c; i++) if (Math.hypot((i + .5) * CELL - x, (j + .5) * CELL - y) < r) occ[j * N + i] = v; }

// ============================================================ terrain chunks
const CH = 512, chunks = new Map();
let pats = null;
function makePats() {
  pats = {};
  for (const k of ["ground", "sand", "grass", "cliff", "water"]) pats[k] = ctx.createPattern(A["tex_" + k], "repeat");
}
function renderChunk(cx, cy) {
  const c = document.createElement("canvas"); c.width = c.height = CH; const g = c.getContext("2d");
  const S = 8, M = CH / S, ox = cx * CH, oy = cy * CH;
  const hs = new Float32Array((M + 2) * (M + 2));
  for (let j = -1; j <= M; j++) for (let i = -1; i <= M; i++) hs[(j + 1) * (M + 2) + i + 1] = hAt(ox + (i + .5) * S, oy + (j + .5) * S);
  const layers = [["sand", TH.water, .012], ["grass", TH.sand, .02], ["ground", TH.grass, .025], ["cliff", TH.cliff - .01, .018]];
  const tmp = document.createElement("canvas"); tmp.width = tmp.height = CH; const tg = tmp.getContext("2d");
  const mk = document.createElement("canvas"); mk.width = mk.height = M; const mg = mk.getContext("2d");
  for (const [tex, th, w] of layers) {
    const id = mg.createImageData(M, M);
    let any = false;
    for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) { const a = smooth(th - w, th + w, hs[(j + 1) * (M + 2) + i + 1]); id.data[(j * M + i) * 4 + 3] = a * 255; if (a > 0) any = true; }
    if (!any) continue;
    mg.putImageData(id, 0, 0);
    tg.globalCompositeOperation = "source-over"; tg.clearRect(0, 0, CH, CH);
    tg.save(); tg.translate(-ox % 512, -oy % 512); tg.fillStyle = pats[tex]; tg.fillRect(0, 0, CH + 512, CH + 512); tg.restore();
    tg.globalCompositeOperation = "destination-in"; tg.imageSmoothingEnabled = true; tg.drawImage(mk, 0, 0, CH, CH);
    g.drawImage(tmp, 0, 0);
  }
  // hill shading + cliff rims
  const sh = mg.createImageData(M, M);
  for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) {
    const at = (a, b) => hs[(j + 1 + b) * (M + 2) + i + 1 + a];
    const h0 = at(0, 0), gx = at(1, 0) - at(-1, 0), gy = at(0, 1) - at(0, -1);
    const land = smooth(TH.water - .01, TH.water + .02, h0);
    let l = (-gx - gy) * 26; // light from top-left
    l += (h0 - TH.grass) * 1.2;
    const rim = smooth(TH.cliff - .03, TH.cliff, h0) * (1 - smooth(TH.cliff, TH.cliff + .03, h0));
    const p = (j * M + i) * 4;
    if (l < 0) { sh.data[p] = sh.data[p + 1] = 0; sh.data[p + 2] = 8; sh.data[p + 3] = clamp(-l * 255, 0, 150) * land; }
    else { sh.data[p] = 200; sh.data[p + 1] = 245; sh.data[p + 2] = 255; sh.data[p + 3] = clamp(l * 120, 0, 60) * land; }
    if (rim > 0) { sh.data[p] = sh.data[p + 1] = sh.data[p + 2] = 0; sh.data[p + 3] = Math.max(sh.data[p + 3], rim * 140); }
  }
  mg.putImageData(sh, 0, 0);
  g.imageSmoothingEnabled = true; g.drawImage(mk, 0, 0, CH, CH);
  // wet dark rim on the shore
  const sr = mg.createImageData(M, M);
  for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) { const h0 = hs[(j + 1) * (M + 2) + i + 1], k = smooth(TH.water, TH.water + .012, h0) * (1 - smooth(TH.water + .012, TH.water + .03, h0)); const p = (j * M + i) * 4; sr.data[p] = 0; sr.data[p + 1] = 20; sr.data[p + 2] = 25; sr.data[p + 3] = k * 120; }
  mg.putImageData(sr, 0, 0); g.drawImage(mk, 0, 0, CH, CH);
  return c;
}
function getChunk(cx, cy) {
  const k = cx + "," + cy; let c = chunks.get(k);
  if (!c) { c = renderChunk(cx, cy); chunks.set(k, c); if (chunks.size > 40) chunks.delete(chunks.keys().next().value); }

  if (G.phase === "day" && G.phaseT >= dayLen) { G.phase = "night"; G.phaseT = 0; spawnWave(); toast(T("nightC")); chime(330); if (G.tut === 5) setTimeout(() => setTut(6), 9000); }

    if (G.day >= WIN_NIGHTS && !G.won) { G.won = true; G.day++; save(); victory(); return; }
    G.day++; save(); toast(T("dawn")); chime(880);
  }
  if (G.tut === 1 && astros.some(a => a.sel)) setTut(2);
  if (G.tut === 2 && astros.some(a => a.job)) setTut(3);
  if (G.tut === 3 && G.crystals >= 100) setTut(4);
  // spawn queue
  if (G.spawnQ && G.spawnQ.length) { G.spawnT -= dt; if (G.spawnT <= 0) { const p = G.spawnQ.shift(); beasts.push({ kind: "e", x: p.x, y: p.y, hp: 110 + G.day * 18, max: 110 + G.day * 18, path: null, repath: 0, tgt: null, cd: 0, dir: "side", flip: false, anim: 0, flee: false, alpha: 0 }); G.spawnT = 2.2; } }

  } else if (b.fade < 1) b.fade = Math.min(1, b.fade + dt / .45);
