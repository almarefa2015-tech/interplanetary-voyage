<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Interplanetary Voyage</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;color:#e8fbff}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;pointer-events:none;z-index:5}
.pill{background:rgba(6,20,30,.72);border:1px solid rgba(80,230,255,.35);border-radius:14px;padding:6px 12px;font-weight:700;font-size:15px;box-shadow:0 0 12px rgba(0,200,255,.15)}
#res{top:max(8px,env(safe-area-inset-top));inset-inline-start:10px;display:flex;gap:6px}
#clock{top:calc(max(8px,env(safe-area-inset-top)) + 40px);left:50%;transform:translateX(-50%);font-size:13px;padding:4px 10px}
#res .pill{font-size:14px;padding:5px 9px}
#topR{top:max(8px,env(safe-area-inset-top));inset-inline-end:10px;display:flex;gap:8px}
.btn{pointer-events:auto;background:rgba(6,24,36,.82);border:1px solid rgba(80,230,255,.5);color:#dff9ff;border-radius:14px;min-width:46px;height:46px;padding:0 12px;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 0 14px rgba(0,210,255,.18)}
.btn:active{transform:scale(.95);background:rgba(20,70,90,.9)}
.btn small{font-size:13px}
.btn.on{background:rgba(0,150,190,.85)}
#acts{bottom:max(10px,env(safe-area-inset-bottom));inset-inline-end:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#mini{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));inset-inline-start:10px;width:130px;height:130px;border:1px solid rgba(80,230,255,.5);border-radius:10px;z-index:5;background:#000;touch-action:none}
#hint{bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:min(560px,62vw);text-align:center;font-size:15px;line-height:1.45;display:none}
#hint.show{display:block;animation:pop .35s}
@keyframes pop{from{transform:translateX(-50%) scale(.9);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#toast{top:92px;left:50%;transform:translateX(-50%);font-size:15px;display:none}
.panel{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,6,12,.6)}
.panel.show{display:flex}
.card{background:linear-gradient(160deg,rgba(8,30,44,.97),rgba(4,14,22,.97));border:1px solid rgba(80,230,255,.5);border-radius:18px;padding:18px 20px;max-width:min(92vw,620px);text-align:center;box-shadow:0 0 30px rgba(0,200,255,.25)}
.card h2{margin:4px 0 10px;font-size:22px;color:#7ff0ff}
.card p{margin:6px 0 12px;font-size:15px;line-height:1.5;color:#cdeef5}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.item{pointer-events:auto;width:150px;background:rgba(10,40,56,.9);border:1px solid rgba(80,230,255,.4);border-radius:14px;padding:8px;cursor:pointer}
.item img{width:100%;height:92px;object-fit:contain}
.item b{display:block;font-size:15px;margin:4px 0 2px}
.item span{font-size:14px;color:#8ff}
.item.dis{opacity:.45}
.big{pointer-events:auto;background:linear-gradient(180deg,#19c3e6,#0a7fa3);border:0;color:#fff;font-size:18px;font-weight:800;border-radius:14px;padding:12px 22px;margin:6px;cursor:pointer}
.big.alt{background:rgba(20,60,80,.95);border:1px solid rgba(80,230,255,.5)}
#introBox{position:fixed;inset:0;z-index:40;background:#000;display:none;align-items:center;justify-content:center}
#introBox.show{display:flex}
#introVid{width:100%;height:100%;object-fit:contain;background:#000}
#skip{position:absolute;top:max(14px,env(safe-area-inset-top));inset-inline-end:16px}
#sub{position:absolute;bottom:8%;left:0;right:0;text-align:center;font-size:clamp(16px,3vw,28px);font-weight:700;text-shadow:0 2px 6px #000;padding:0 10%}
#place{position:fixed;z-index:6;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:none;gap:12px}
#place.show{display:flex}
#upP .card{width:min(94vw,620px);padding:0;overflow:hidden;text-align:start;background:linear-gradient(165deg,#0f3448 0%,#082030 45%,#04121c 100%);border:1px solid rgba(110,240,255,.65);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 40px rgba(0,210,255,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.upHead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(180deg,rgba(80,220,255,.28),rgba(80,220,255,.05));border-bottom:1px solid rgba(110,240,255,.35)}
.upHead b{font-size:20px;color:#bff6ff;text-shadow:0 0 10px rgba(0,220,255,.6)}
.upLv{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.upLv .lv{background:linear-gradient(180deg,#1b5c75,#0b2c3c);border:1px solid #6ef;border-radius:10px;padding:2px 10px}
.upLv .nx{background:linear-gradient(180deg,#2fb06a,#136b3c);border-color:#7f9}
.upBody{display:flex;gap:14px;padding:12px 16px}
.upPic{flex:0 0 38%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 60%,rgba(70,220,255,.35),rgba(0,0,0,0) 65%);border-radius:14px}
.upPic img{width:100%;max-height:150px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.7)) drop-shadow(0 0 12px rgba(0,220,255,.35))}
.upStats{flex:1;display:flex;flex-direction:column;gap:9px;justify-content:center}
.st .lb{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:3px}
.st .lb i{font-style:normal;color:#7f9}
.st .bar{position:relative;height:13px;border-radius:7px;background:rgba(0,0,0,.55);box-shadow:inset 0 2px 4px rgba(0,0,0,.8);overflow:hidden}
.st .bar .cur{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#7ef3ff,#139fc2);box-shadow:0 0 8px rgba(0,220,255,.7)}
.st .bar .nxt{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(120,255,160,.85) 0 6px,rgba(60,200,110,.85) 6px 12px);animation:shim 1s linear infinite}
[dir=rtl] .st .bar .cur{inset:0 0 0 auto}
@keyframes shim{to{background-position:24px 0}}
.upFoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 14px;border-top:1px solid rgba(110,240,255,.2);flex-wrap:wrap}
.upCost{display:flex;gap:14px;font-weight:800;font-size:16px}
.upCost .bad{color:#ff7a6a}
.upBtns{display:flex;gap:8px}
.big.gold{background:linear-gradient(180deg,#ffd76a,#d18a12);color:#2a1600;box-shadow:0 0 14px rgba(255,200,80,.5)}
.big.dim{opacity:.5}
.upProg{padding:0 16px 6px}
.upProg .bar{height:16px}
.upProg .cur{background:linear-gradient(180deg,#ffe58a,#d99a1a)!important}
#hand{position:fixed;z-index:30;font-size:46px;pointer-events:none;display:none;filter:drop-shadow(0 0 10px #4ef);animation:bob .8s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes bob{from{margin-top:0}to{margin-top:16px}}
#buildP .card,#resP .card{max-height:90vh;overflow-y:auto}
#buildP .item{width:124px;padding:6px;position:relative}
#buildP .item img{height:66px}
#buildP .item b{font-size:13px}
#buildP .item span{font-size:12px}
.item .lk{display:block;font-size:11px;color:#ffb27a;margin-top:2px;line-height:1.25}
.item.tutPick{border:2px solid #ffd76a;box-shadow:0 0 18px #ffd76a;animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 4px #ffd76a}}
.item.lock img{filter:grayscale(1) brightness(.6)}
#resP .card{width:min(94vw,640px);text-align:start}
.rs{display:flex;align-items:center;gap:10px;background:rgba(10,40,56,.85);border:1px solid rgba(80,230,255,.3);border-radius:12px;padding:8px 10px;margin:6px 0}
.rs .ic{font-size:26px;width:34px;text-align:center}
.rs .tx{flex:1}
.rs .tx b{display:block;font-size:15px}
.rs .tx span{font-size:13px;color:#a9dbe6}
.rs .tx .bar{height:8px;border-radius:4px;background:rgba(0,0,0,.5);margin-top:4px;overflow:hidden}
.rs .tx .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffe58a,#d99a1a)}
.rs .go{pointer-events:auto;background:linear-gradient(180deg,#19c3e6,#0a7fa3);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.rs .go.dim{opacity:.45}
.rs.done{opacity:.6}
#upAct{background:linear-gradient(180deg,#9b6bff,#5a2fc0)}
#loading{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;font-size:18px;color:#7ff0ff}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="mini" width="130" height="130"></canvas>

<div id="res" class="hud"><div class="pill" id="crys">💎 0</div><div class="pill" id="pow">⚡ 0</div><div class="pill" id="crew">👨‍🚀 0</div><div class="pill" id="life"></div></div>

<div id="toast" class="hud pill"></div>

<div class="panel" id="buildP"><div class="card">

  <div class="row" id="buildRow"></div>
  <div class="big alt" id="buildClose" data-t="close"></div>
</div></div>

<div class="panel" id="wreckP"><div class="card">
  <img id="wImg" style="width:220px;height:140px;object-fit:contain">
  <h2 id="wName"></h2><p id="wDesc"></p>
  <div class="row"><div class="big" id="wGo"></div><div class="big alt" id="wNo" data-t="close"></div></div>
</div></div>
<div id="hand">👆</div>
<div class="panel" id="upP"><div class="card">

</div></div>

<div class="panel" id="resP"><div class="card">
  <h2 id="resT"></h2>
  <div id="resList"></div>
  <div style="text-align:center"><div class="big alt" id="resClose" data-t="close"></div></div>
</div></div>

<div class="panel" id="menuP"><div class="card">
  <h2>Interplanetary Voyage</h2>
  <div class="big" id="mResume" data-t="resume"></div>
  <div class="big alt" id="mIntro" data-t="intro"></div>
  <div class="big alt" id="mNew" data-t="newgame"></div>
  <div class="big alt" id="mSound"></div>
</div></div>

<div class="panel" id="endP"><div class="card">
  <h2 id="endT"></h2><p id="endM"></p>
  <div class="row" id="endBtns"></div>
</div></div>

<div id="introBox"><video id="introVid" playsinline preload="auto"></video><div id="sub"></div><div class="btn" id="skip" data-t="skip"></div></div>
<div id="loading">…</div>
